# A spare tyre.
#
# The checked-in Quiet.xcodeproj is the real project. If it ever refuses to open
# — a merge went badly, or a future Xcode changes the format — this regenerates
# an equivalent one from the folders on disk:
#
#     brew install xcodegen && xcodegen generate
#
# Nothing in the app depends on XcodeGen being installed.

name: Quiet
options:
  bundleIdPrefix: com.connexa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Quiet:
    type: application
    platform: iOS
    sources:
      - path: Quiet
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.connexa.quiet
        DEVELOPMENT_TEAM: B97SQSQBMR
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  QuietTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuietTests
    dependencies:
      - target: Quiet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connexa.quiet.tests

schemes:
  Quiet:
    build:
      targets:
        Quiet: all
    test:
      targets:
        - QuietTests
