# A spare tyre.
#
# The checked-in Quiet.xcodeproj is the real project. If it ever refuses to open
# — a merge went badly, or a future Xcode changes the format — this regenerates
# an equivalent one from the folders on disk:
#
#     brew install xcodegen && xcodegen generate
#
# Nothing in the app depends on XcodeGen being installed.

name: Quiet
options:
  bundleIdPrefix: com.connexa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # The app speaks six languages; the catalogue carries all of them.
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Quiet:
    type: application
    platform: iOS
    sources:
      - path: Quiet
      - path: Shared
    dependencies:
      - target: QuietActivity
      - target: QuietShield
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Quiet.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.connexa.quiet
        DEVELOPMENT_TEAM: B97SQSQBMR
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  # Woken by Screen Time when the Instagram app crosses a minute, and at four
  # in the morning. See `Monitor`.
  QuietActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: QuietActivity
        excludes: [Info.plist, QuietActivity.entitlements]
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: QuietActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuietActivity/QuietActivity.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.connexa.quiet.activity
        DEVELOPMENT_TEAM: B97SQSQBMR
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES

  # What stands in front of the Instagram app once it is closed for the day.
  # See `ShieldConfig`.
  QuietShield:
    type: app-extension
    platform: iOS
    sources:
      - path: QuietShield
        excludes: [Info.plist, QuietShield.entitlements]
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: QuietShield/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuietShield/QuietShield.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.connexa.quiet.shield
        DEVELOPMENT_TEAM: B97SQSQBMR
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES

  QuietTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuietTests
    dependencies:
      - target: Quiet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connexa.quiet.tests

  QuietUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QuietUITests
    dependencies:
      - target: Quiet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connexa.quiet.uitests
        TEST_TARGET_NAME: Quiet

schemes:
  Quiet:
    build:
      targets:
        Quiet: all
    test:
      targets:
        - QuietTests
        - QuietUITests
