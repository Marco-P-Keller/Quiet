name: Quiet

# Builds the iOS app and runs its tests on a real macOS machine with a real
# Xcode, because a project that has only ever been read is not a project that
# works. Only runs when something under the app actually changes.
on:
  push:
    paths:
      - 'Quiet/**'
      - '.github/workflows/quiet.yml'
  pull_request:
    paths:
      - 'Quiet/**'
      - '.github/workflows/quiet.yml'
  workflow_dispatch:

concurrency:
  group: quiet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Quiet

    steps:
      - uses: actions/checkout@v4

      # The newest Xcode on the image, so the project format is never the
      # limiting factor.
      #
      # A previous version of this file preferred the image's default instead,
      # on the theory that the newest Xcode's simulator runtime would not boot.
      # That was wrong. Nothing was hanging: the boot below takes about ninety
      # seconds, and the run that looked stuck had simply not finished yet. The
      # note stays as a reminder that a silent step is not evidence of anything,
      # which is the entire reason the phases below are separate and timed.
      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Boot a simulator
        id: sim
        timeout-minutes: 8
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available \
            | sed -n 's/^ *\(iPhone [^(]*\) (.*/\1/p' \
            | sed 's/ *$//' \
            | head -1)
          if [ -z "$device" ]; then
            echo "No iPhone simulator on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Booting $device"
          xcrun simctl boot "$device" || true
          time xcrun simctl bootstatus "$device" -b
          echo "device=$device" >> "$GITHUB_OUTPUT"

      # Split from the run below so that a slow compile and a stuck test are
      # two different lines in the log rather than one silence.
      - name: Build for testing
        run: |
          set -o pipefail
          # Signing is deliberately left alone. Turning it off with
          # CODE_SIGNING_ALLOWED=NO built fine and cost the app its memory: an
          # unsigned build carries no application-identifier entitlement, so
          # iOS refuses every keychain write with -34018, and Quiet's one
          # promise — that the limit outlives the app — quietly stopped being
          # true. A simulator destination ad-hoc signs without needing a team.
          time xcodebuild build-for-testing \
            -project Quiet.xcodeproj \
            -scheme Quiet \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            2>&1 \
            | tee build.log \
            | sed "s|$GITHUB_WORKSPACE/||g" \
            | grep -E "error:|warning:|\*\* BUILD"

      - name: Test
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Quiet.xcodeproj \
            -scheme Quiet \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 180 \
            -parallel-testing-enabled NO \
            2>&1 \
            | tee -a build.log \
            | sed "s|$GITHUB_WORKSPACE/||g" \
            | grep -E "error:|Test Case|Executed |Test Suite .* (passed|failed)|\*\* TEST"

      # Tests prove the rules. They prove nothing about whether the thing
      # launches, or what it looks like when it does. So: install it, start
      # it, photograph it, and read back anything it said to the system log.
      # The picture comes through the log because that is the only channel out
      # of here, so it is deliberately small — enough to judge a layout, not a
      # hairline.
      - name: Look at it
        # Always, not only when green: a picture of the app in the state that
        # failed is worth more than no picture at all.
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          app=$(find ~/Library/Developer/Xcode/DerivedData \
            -name "Quiet.app" -path "*Debug-iphonesimulator*" | head -1)
          echo "Installing $app"
          xcrun simctl install booted "$app"
          xcrun simctl launch booted com.connexa.quiet
          # The UI test has already answered setup, so this launch lands on the
          # feed. Long enough for Instagram to arrive over a data centre's
          # network before the shutter.
          sleep 14

          xcrun simctl io booted screenshot --type=png shot.png
          sips -Z 420 -s format jpeg -s formatOptions 68 shot.png --out shot.jpg >/dev/null
          ls -l shot.png shot.jpg

          echo "----BEGIN SCREENSHOT----"
          base64 -b 200 -i shot.jpg
          echo "----END SCREENSHOT----"

          echo "----BEGIN APP LOG----"
          xcrun simctl spawn booted log show --last 60s --style compact \
            --predicate 'process == "Quiet"' 2>/dev/null | head -40 || echo "(nothing)"
          echo "----END APP LOG----"

      # And it is checked against what the source says, so it fails rather than
      # merely reports. It has already earned that once: a container added
      # between the app and the window was centring the browsing screen and
      # hanging it twelve and a half points off the bottom of the glass, so
      # moving the row up by thirteen moved it by half a point. Nothing was
      # wrong with the row. A number that is only printed is a number nobody
      # reads until somebody has taken four photographs.
      #
      # A measurement that cannot be taken at all is not a failure — a missing
      # Pillow must not stand in for a broken layout — so only a disagreement
      # is red.
      - name: Measure the row
        if: always()
        timeout-minutes: 6
        run: |
          set -uo pipefail
          if ! python3 -m pip install --quiet --disable-pip-version-check pillow \
            && ! python3 -m pip install --quiet --break-system-packages pillow; then
            echo "Could not install Pillow, so the row was not measured."
            exit 0
          fi
          set -e
          # What the source says, read out of the source, so the two can never
          # drift apart quietly.
          expected=$(sed -n 's/.*islandLift: CGFloat = \([0-9.]*\).*/\1/p' \
            Quiet/UI/BrowserScreen.swift)
          echo "The source says $expected pt."
          xcrun simctl ui booted appearance dark
          xcrun simctl terminate booted com.connexa.quiet >/dev/null 2>&1 || true
          xcrun simctl launch booted com.connexa.quiet -QuietRehearsal island >/dev/null
          sleep 4
          xcrun simctl io booted screenshot --type=png island.png
          xcrun simctl ui booted appearance light
          python3 Tools/measure-the-row.py island.png --expect "$expected"

          # And the sheet, which is the one that has cost eleven builds.
          #
          # A sheet the shape of Instagram's is put on the real page by a
          # rehearsal — held against the bottom of the viewport, the width of
          # it, saying nothing anywhere about being modal, which is the case
          # that went unasked for seven rounds. Its foot is a bright band, and
          # the whole question is how far that band ends up from the bottom
          # edge of the screen.
          #
          # Zero means the viewport still runs to the bottom of the glass and
          # the sheet's last control is under Quiet's row. The height of the row
          # is what it should be instead: the web view stops there, so the
          # bottom of the page's world is the top of the row.
          #
          # Summed out of the three numbers the row is built from rather than
          # written down here, so the check follows the row when it moves.
          number() {
            sed -n "s/.*$1: CGFloat = \([0-9.]*\).*/\1/p" \
              Quiet/UI/BrowserScreen.swift
          }
          room=$(python3 -c \
            "print($(number islandHeight) + $(number islandLift) + $(number islandAir))")
          echo "The row is $room pt tall, so the page stops there."
          xcrun simctl terminate booted com.connexa.quiet >/dev/null 2>&1 || true
          xcrun simctl launch booted com.connexa.quiet -QuietRehearsal sheet >/dev/null
          # Long enough for the page to arrive and the sheet to be put on it.
          sleep 16
          xcrun simctl io booted screenshot --type=png sheet.png
          # And the picture itself when it cannot be measured. A check that
          # fails without showing what it saw costs a build to learn nothing.
          if ! python3 Tools/measure-the-row.py sheet.png --sheet --expect "$room"; then
            sips -Z 420 -s format jpeg -s formatOptions 68 sheet.png \
              --out sheet.jpg >/dev/null
            echo "----BEGIN SHEET----"
            base64 -b 200 -i sheet.jpg
            echo "----END SHEET----"
            exit 1
          fi

      # The full log is thousands of lines of module compilation. What anybody
      # actually needs after a red run is the handful of lines naming what
      # broke, in one place, without scrolling.
      - name: Digest
        if: always()
        run: |
          # `grep ... | head` exits with head's status, which is always zero, so
          # a trailing `|| echo "None."` never fires and an empty section looks
          # like a broken digest. Collect first, then decide.
          section() {
            local found
            found=$(eval "$2" || true)
            echo "### $1"
            echo "${found:-None.}"
            echo
          }
          strip="sed \"s|$GITHUB_WORKSPACE/||g\""
          {
            echo "## Quiet"
            echo
            section "Errors"       "grep -E 'error:' build.log | $strip | sort -u | head -40"
            section "Failed tests" "grep -E '^Test Case .* failed' build.log | sort -u | head -40"
            section "Warnings"     "grep -E 'warning:' build.log | $strip | sort -u | head -60"
            grep -E "^Executed [0-9]+ test" build.log | tail -2 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the log and the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            Quiet/build.log
            Quiet/TestResults.xcresult
          retention-days: 7
