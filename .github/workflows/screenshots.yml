name: Screenshots

# Photographs every screen Quiet owns, at the size the App Store asks for.
#
# The app's own screens are the ones worth showing: the question it opens with,
# the panel, the limit screen, and the curtain. Reaching the curtain honestly
# costs five minutes of staring at a simulator, so a debug-only launch argument
# puts the day where it needs to be. Nothing here can affect a build anybody can
# install — `Rehearsal` is wrapped in `#if DEBUG` in its entirety.
#
# The full-size images go out as an artifact, for the listing. Small previews go
# into the log, because that is the only channel out of this environment that a
# person reading a run can use immediately.
on:
  push:
    paths:
      - 'Quiet/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  photograph:
    name: Photograph every screen
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Quiet

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      # The App Store wants 6.9 inches: 1320 × 2868. That is the Pro Max, and
      # only the Pro Max — a screenshot from a smaller phone is rejected on
      # upload rather than scaled. Any iPhone will do for looking at the app,
      # so the fallback is not fatal, only smaller.
      - name: Boot the biggest iPhone
        id: sim
        timeout-minutes: 10
        run: |
          set -euo pipefail
          available=$(xcrun simctl list devices available \
            | sed -n 's/^ *\(iPhone [^(]*\) (.*/\1/p' | sed 's/ *$//')
          device=$(echo "$available" | grep -m1 "Pro Max" || echo "$available" | head -1)
          if [ -z "$device" ]; then
            echo "No iPhone simulator on this runner" >&2
            exit 1
          fi
          echo "Booting $device"
          xcrun simctl boot "$device" || true
          time xcrun simctl bootstatus "$device" -b
          echo "device=$device" >> "$GITHUB_OUTPUT"

      - name: Build
        timeout-minutes: 25
        run: |
          set -o pipefail
          time xcodebuild build \
            -project Quiet.xcodeproj \
            -scheme Quiet \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath DerivedData \
            2>&1 \
            | sed "s|$GITHUB_WORKSPACE/||g" \
            | grep -E "error:|warning:|\*\* BUILD"

      - name: Photograph
        timeout-minutes: 15
        run: |
          set -euo pipefail
          app="DerivedData/Build/Products/Debug-iphonesimulator/Quiet.app"
          xcrun simctl install booted "$app"
          mkdir -p shots

          # One launch per photograph, because the state is written before the
          # session reads it and a relaunch is the only honest way to get there.
          shoot () {
            local name="$1" scene="$2"; shift 2
            xcrun simctl terminate booted com.connexa.quiet >/dev/null 2>&1 || true
            xcrun simctl launch booted com.connexa.quiet -QuietRehearsal "$scene" "$@" >/dev/null
            # The browsing screen holds Quiet's own paper over the web view
            # until the first page settles, so this waits for the page rather
            # than for the app.
            if [ "$scene" = "browsing" ]; then sleep 14; else sleep 6; fi
            xcrun simctl io booted screenshot --type=png "shots/$name.png"
          }

          shoot opening opening
          shoot setup   fresh
          shoot panel   panel
          shoot limit   limit
          shoot search  search
          shoot curtain spent
          shoot feed    browsing

          # The same screens at the largest size anybody's phone can be set to.
          # This is where a serif display line and a wheel of numbers break.
          #
          # Set on the device rather than passed to the app. The launch argument
          # -UIPreferredContentSizeCategoryName takes the short spelling
          # (…AccessibilityXXXL); the long one is silently ignored, which is how
          # the first version of this step produced four screenshots identical
          # to the ordinary ones and looked like it had checked something.
          xcrun simctl ui booted content_size accessibility-extra-extra-extra-large
          shoot setup-largest   fresh
          shoot panel-largest   panel
          shoot limit-largest   limit
          shoot curtain-largest spent
          xcrun simctl ui booted content_size large

          # At night. Quiet has a complete dark palette that nobody has looked at.
          xcrun simctl ui booted appearance dark
          shoot opening-dark opening
          shoot setup-dark   fresh
          shoot panel-dark   panel
          shoot curtain-dark spent
          xcrun simctl ui booted appearance light

          # And in German, which is a third longer than English and therefore
          # the real test of every line that was written to fit.
          german="-AppleLanguages (de) -AppleLocale de_DE"
          shoot setup-german   fresh $german
          shoot panel-german   panel $german
          shoot limit-german   limit $german
          shoot curtain-german spent $german

          file shots/*.png | sed 's|.*/||'

      # The listing's own screenshots, which are a different job from the
      # diagnostic ones above. Those exist to show whether a layout survived;
      # these exist to be uploaded. Dark, because that is the appearance every
      # screen in the set was designed around and the one Instagram's own app
      # is usually in; both languages, because the first frames are the ones
      # worth localising; and one scene per launch, same as above.
      #
      # Not one of them photographs Instagram. That is deliberate and the
      # reasoning is in docs/store-listing.md: the app being sold is the
      # limiter, and a listing made of somebody else's product raises 5.2.1
      # before a reviewer has read a word.
      - name: Photograph for the store
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # 9:41 and a full battery are what Apple's own screenshots carry. The
          # bar is cropped off every frame anyway; this is here so that nothing
          # odd — a runner's date, a charging bolt, one bar of signal — can
          # arrive in a frame if that crop is ever a few points out.
          xcrun simctl status_bar booted override \
            --time 9:41 --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 \
            --dataNetwork wifi --wifiMode active --wifiBars 3
          xcrun simctl ui booted appearance dark

          store () {
            local lang="$1" name="$2" scene="$3"; shift 3
            mkdir -p "shots/store/$lang"
            xcrun simctl terminate booted com.connexa.quiet >/dev/null 2>&1 || true
            xcrun simctl launch booted com.connexa.quiet -QuietRehearsal "$scene" "$@" >/dev/null
            sleep 6
            xcrun simctl io booted screenshot --type=png "shots/store/$lang/$name.png"
          }

          # scene:name — the scenes are states of the app, the names are what
          # the listing calls them.
          scenes="opening:opening limit:limit spent:curtain panel:panel fresh:setup"
          for pair in $scenes; do store en "${pair#*:}" "${pair%:*}"; done
          german="-AppleLanguages (de) -AppleLocale de_DE"
          for pair in $scenes; do store de "${pair#*:}" "${pair%:*}" $german; done

          xcrun simctl status_bar booted clear
          xcrun simctl ui booted appearance light
          file shots/store/*/*.png | sed 's|.*/store/||'

      # Caption, crop, compose, and then check the result the way a machine can:
      # the size to the pixel, no alpha channel, ink in the caption band and a
      # photograph in the card. Every one of those failures looks fine on a
      # screen and costs a rejected upload.
      - name: Compose the App Store frames
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow \
            || python3 -m pip install --quiet --break-system-packages pillow
          python3 Tools/make-the-store-shots.py \
            --source shots/store --out shots/store-frames
          python3 Tools/read-the-shots.py shots/store-frames

      # Big enough to read a caption at, because the caption is the only part
      # of these a run can get wrong in a way the checks above cannot see.
      - name: Look at the frames
        if: always()
        run: |
          set -euo pipefail
          for f in shots/store-frames/*/*.png; do
            [ -f "$f" ] || continue
            name=$(echo "$f" | sed 's|shots/store-frames/||; s|/|-|; s|\.png$||')
            sips -Z 640 -s format jpeg -s formatOptions 62 "$f" --out "/tmp/$name.jpg" >/dev/null
            echo "----BEGIN $name----"
            base64 -b 200 -i "/tmp/$name.jpg"
            echo "----END $name----"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-screenshots
          path: |
            Quiet/shots/store-frames/**
            Quiet/shots/store/**
          if-no-files-found: error

      # The row is a different shape on a phone with a home button, and a claim
      # about a shape is worth exactly what a picture of it is worth. The same
      # build installs on any simulator, so this costs a boot and nothing else.
      #
      # Never fatal, and never quiet about why. The first version of this step
      # died in four seconds and said nothing, which is worse than not taking
      # the photograph: a red run that means nothing trains you to ignore red
      # runs. Every command reports, and the step cannot fail.
      - name: Photograph a phone with a home button
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set +e
          # By identifier rather than by name: a name has spaces, a generation
          # in brackets, and a different spelling every year.
          small=$(xcrun simctl list devices available \
            | grep -m1 "iPhone SE" \
            | sed -n 's/.*(\([0-9A-F-]\{36\}\)).*/\1/p')
          if [ -z "$small" ]; then
            echo "No iPhone SE on this runner. Available:"
            xcrun simctl list devices available | grep iPhone || true
            exit 0
          fi
          echo "Using $small"

          xcrun simctl shutdown all
          echo "shutdown all: $?"
          xcrun simctl boot "$small"
          echo "boot: $?"
          xcrun simctl bootstatus "$small" -b
          echo "bootstatus: $?"

          app="DerivedData/Build/Products/Debug-iphonesimulator/Quiet.app"
          xcrun simctl install "$small" "$app"
          if [ $? -ne 0 ]; then
            echo "Could not install on the SE; leaving it."
            exit 0
          fi

          shoot () {
            xcrun simctl terminate "$small" com.connexa.quiet >/dev/null 2>&1
            xcrun simctl launch "$small" com.connexa.quiet -QuietRehearsal "$2" >/dev/null
            [ "$2" = "browsing" ] && sleep 14 || sleep 6
            xcrun simctl io "$small" screenshot --type=png "shots/$1.png"
            echo "$1: $?"
          }

          shoot feed-home-button  browsing
          shoot setup-home-button fresh
          exit 0

      # Small enough to travel through a log, large enough to judge a layout.
      - name: Look at them
        if: always()
        run: |
          set -euo pipefail
          cd shots
          for f in feed feed-home-button setup setup-home-button \
                   panel limit search curtain \
                   setup-largest panel-largest limit-largest curtain-largest \
                   setup-dark panel-dark curtain-dark \
                   setup-german panel-german limit-german curtain-german; do
            [ -f "$f.png" ] || continue
            # The accessibility sizes are the ones worth looking at closely,
            # so they travel bigger. A layout that fails at the largest text
            # size fails in a detail, and 380 pixels cannot show a detail.
            case "$f" in
              # The feed and the accessibility sizes are the two worth looking
              # at closely: one carries Quiet's own furniture over somebody
              # else's page, the other is where a layout gives way.
              feed|feed-home-button|*-largest) width=760 ;;
              *)              width=420 ;;
            esac
            sips -Z "$width" -s format jpeg -s formatOptions 60 "$f.png" --out "$f.jpg" >/dev/null
            echo "----BEGIN $f----"
            base64 -b 200 -i "$f.jpg"
            echo "----END $f----"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: Quiet/shots/*.png
          if-no-files-found: error
